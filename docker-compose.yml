services:
  concierge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4180
      - CONCIERGE_DB=/data/concierge.sqlite
    volumes:
      - concierge-data:/data
      # Official GTFS timetables (Metro de Granada, urban bus): drop the .zip files in ./data/gtfs
      - ./data/gtfs:/data/gtfs:ro
    expose: ["4180"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [concierge]

volumes:
  concierge-data:
  caddy-data:
  caddy-config:
