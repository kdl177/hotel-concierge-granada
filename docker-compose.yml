services:
  concierge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4180
      - CONCIERGE_DB=/data/concierge.sqlite
    volumes:
      - concierge-data:/data
      # Official GTFS timetables (Metro de Granada, urban bus): drop the .zip files in ./data/gtfs
      - ./data/gtfs:/data/gtfs:ro
    expose: ['4180']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4180/api/h/default/config']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env (deploy/install.sh does it)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [concierge]

volumes:
  concierge-data:
  caddy-data:
  caddy-config:
